<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSD Humanities — Suivi de notes · démo</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f0f2f8; --border:#dfe3ee;
  --text:#1c2230; --text-muted:#5b6478; --text-faint:#8991a4;
  --primary:#a5791f; --primary-dark:#8a641a; --primary-bg:#faf3df;
  --danger:#d64550; --danger-bg:#fdecee;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,25,45,.04), 0 6px 20px rgba(20,25,45,.06);
  --g-a:#1f9d63; --g-a-bg:#e4f7ee;
  --g-b:#2b83c9; --g-b-bg:#e7f2fb;
  --g-c:#c99a1e; --g-c-bg:#fbf3de;
  --g-d:#d97b2b; --g-d-bg:#fdeee0;
  --g-x:#c94141; --g-x-bg:#fbe6e6;
  --font: Calibri, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --font-serif: "SangBleu OG Sans", "SangBleu Sans", Georgia, serif;
  /* identité Beau Soleil — valeurs vérifiées dans les SVG officiels (charte 2025) */
  --navy-deep:#11152e; --navy:#1a2047; --navy-2:#14387f;
  --gold:#f3be31; --gold-light:#f6d26e; --cream:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161f; --surface:#1c1f2c; --surface-2:#232635; --border:#2f3345;
    --text:#eef0f6; --text-muted:#a7aec2; --text-faint:#747d95;
    --primary:#d9b466; --primary-dark:#e6c877; --primary-bg:#3a2f14;
    --danger:#e8747c; --danger-bg:#3a2228;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 24px rgba(0,0,0,.35);
    --g-a:#4ecb90; --g-a-bg:#173327;
    --g-b:#6bb3ee; --g-b-bg:#17293a;
    --g-c:#e4c25c; --g-c-bg:#3a3018;
    --g-d:#f0a15f; --g-d-bg:#3a2a17;
    --g-x:#f0888e; --g-x-bg:#3a2020;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14.5px; line-height:1.5;
}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
h1,h2,h3,h4{ margin:0 0 4px 0; font-weight:700; }
p{margin:0 0 8px 0;}
a{color:var(--primary);}

/* ---------- splash (identité Beau Soleil : nuit étoilée, montagnes, or) ---------- */
#splash{
  position:relative; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  text-align:center; padding:20px; gap:6px;
  background:
    radial-gradient(ellipse 700px 420px at 50% -4%, rgba(243,190,49,.28), transparent 60%),
    radial-gradient(1200px 800px at 85% 8%, rgba(26,44,96,.55), transparent 60%),
    linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 55%, #060a1d 100%);
}
#splash .stars{ position:absolute; inset:0; z-index:0;
  background-image:
    radial-gradient(circle 1px at 8% 15%, #fff, transparent), radial-gradient(circle 1px at 18% 40%, #fff, transparent),
    radial-gradient(circle 1.4px at 27% 12%, #fff, transparent), radial-gradient(circle 1px at 35% 55%, #fff, transparent),
    radial-gradient(circle 1px at 44% 22%, #fff, transparent), radial-gradient(circle 1.4px at 52% 8%, #fff, transparent),
    radial-gradient(circle 1px at 61% 34%, #fff, transparent), radial-gradient(circle 1px at 70% 14%, #fff, transparent),
    radial-gradient(circle 1.4px at 78% 45%, #fff, transparent), radial-gradient(circle 1px at 86% 20%, #fff, transparent),
    radial-gradient(circle 1px at 93% 38%, #fff, transparent), radial-gradient(circle 1px at 12% 65%, #fff, transparent),
    radial-gradient(circle 1px at 58% 60%, #fff, transparent), radial-gradient(circle 1.2px at 95% 62%, #fff, transparent),
    radial-gradient(circle 1px at 3% 30%, var(--gold-light), transparent), radial-gradient(circle 1px at 66% 48%, var(--gold-light), transparent);
  opacity:.85;
}
#splash .sparkle{ position:absolute; color:var(--gold-light); opacity:.8; z-index:0; }
#splash .mountains{ position:absolute; left:0; right:0; bottom:0; width:100%; height:46%; z-index:1; }
#splash .content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:6px; }
#splash .crest{ margin-bottom:6px; }
#splash .icon{ font-size:44px; margin-bottom:6px; }
#splash h1{ font-family:var(--font-serif); font-size:32px; font-weight:400; color:var(--cream); letter-spacing:.03em; margin-bottom:4px; }
#splash .eyebrow{ font-family:var(--font-serif); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-light); margin-bottom:10px; }
#splash .tagline{ color:#c3c9e6; font-size:14px; margin-bottom:26px; }
#splash .langRow{ display:flex; gap:8px; margin-bottom:22px; }
#splash .langBtn{
  padding:8px 18px; border-radius:999px; border:1.5px solid rgba(243,190,49,.55); background:rgba(255,255,255,.04);
  cursor:pointer; font-weight:700; font-size:13px; color:var(--cream);
}
#splash .langBtn.active{ background:var(--gold); border-color:var(--gold); color:var(--navy-deep); }
#splash .startBtn{
  padding:14px 44px; border-radius:999px; border:none; background:linear-gradient(180deg, var(--gold-light), var(--gold)); color:var(--navy-deep);
  font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 6px 20px rgba(243,190,49,.35);
}
#splash .startBtn:hover{ filter:brightness(1.06); }
#splash .footnote{ margin-top:28px; color:#8b93b8; font-size:11.5px; max-width:360px; }
#splash .signature{ margin-top:14px; color:var(--gold-light); font-family:var(--font-serif); font-size:12px; opacity:.85; max-width:360px; }
#splash .version{ margin-top:10px; color:#5c6690; font-size:10.5px; letter-spacing:.03em; }

/* ---------- layout ---------- */
#app{ display:flex; min-height:100vh; }
#sidebar{
  width:220px; flex:0 0 220px; background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  border-right:1px solid rgba(243,190,49,.25);
  display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh;
}
#sidebar .brand{ display:flex; align-items:center; gap:9px; padding:6px 10px 2px; }
#sidebar .brandmark{ font-size:19px; }
#sidebar h1{ font-family:var(--font-serif); font-size:15.5px; color:var(--cream); font-weight:400; letter-spacing:.01em; margin:0; }
#sidebar .subtitle{ font-size:11px; color:#9aa3c9; padding:2px 10px 16px; }
.navbtn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px;
  border:none; background:none; border-radius:var(--radius-sm); cursor:pointer; color:#c2c8e6;
  font-size:13.5px; font-weight:600; margin-bottom:2px;
}
.navbtn:hover{ background:rgba(255,255,255,.06); color:var(--cream); }
.navbtn.active{ background:rgba(243,190,49,.16); color:var(--gold-light); }
.navbtn .ic{ font-size:22px; width:28px; text-align:center; }
.sidebarBottom{ margin-top:auto; }
.feedbackBtn{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 10px;
  border:none; background:none; border-radius:var(--radius-sm); cursor:pointer; color:#8891b8;
  font-size:12px; font-weight:600;
}
.feedbackBtn:hover{ background:rgba(255,255,255,.06); color:var(--gold-light); }
#sidebar .foot{ padding:10px; font-size:11px; color:#7c85ab; }

.fbOverlay{
  position:fixed; inset:0; background:rgba(10,15,35,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.fbModal{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:20px; width:100%; max-width:440px; max-height:90vh; overflow:auto;
}
.fbModal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.fbModal-head h3{ margin:0; }
.fbCloseBtn{
  width:26px; height:26px; flex:0 0 26px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer; font-size:13px;
}
.fbCloseBtn:hover{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); }
.fbModal textarea{ width:100%; }

#main{ flex:1; min-width:0; display:flex; flex-direction:column; }
#topbar{
  display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid rgba(243,190,49,.3);
  background:var(--navy); position:sticky; top:0; z-index:5; flex-wrap:wrap;
}
#topbar .label{ font-size:12px; color:#9aa3c9; font-weight:600; }
#classSelect{
  padding:8px 12px; border-radius:var(--radius-sm); border:1px solid rgba(243,190,49,.4); background:rgba(255,255,255,.06);
  color:var(--cream); font-weight:700; min-width:170px;
}
#classSelect option{ color:#1c2230; }
#renameClassBtn{ background:rgba(255,255,255,.08); border-color:rgba(243,190,49,.4); color:var(--cream); }
.savedTag{ font-size:11.5px; color:#9aa3c9; margin-left:auto; }
#content{ padding:24px 26px 84px; max-width:1180px; width:100%; margin:0 auto; }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;
}
.card h2{ font-size:16px; }
.card h3{ font-size:13.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
.hint{ font-size:12.5px; color:var(--text-faint); }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.row.between{ justify-content:space-between; }
.grid{ display:grid; gap:14px; }
.grid.cols-2{ grid-template-columns:1fr 1fr; }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
#mobileNav{ display:none; }
@media (max-width:760px){
  .grid.cols-2,.grid.cols-3{ grid-template-columns:1fr; }
  #sidebar{ display:none; }
  #topbar{ padding:10px 14px; }
  #content{ padding:16px 14px 92px; }
  .card{ padding:14px 15px; }
  #mobileNav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-top:1px solid rgba(243,190,49,.3);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content:space-around;
  }
  #mobileNav .mnavbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
    border:none; background:none; color:#9aa3c9; font-size:9.5px; font-weight:700; cursor:pointer;
  }
  #mobileNav .mnavbtn .ic{ font-size:21px; }
  #mobileNav .mnavbtn.active{ color:var(--gold-light); }
  .toggle{ width:36px; height:36px; }
  .seg button{ width:30px; height:36px; }
}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface-2); cursor:pointer; font-weight:600; color:var(--text);
  white-space:nowrap;
}
.btn:hover{ filter:brightness(1.04); }
.btn.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
.btn.primary:hover{ background:var(--primary-dark); }
.btn.danger{ background:var(--danger-bg); border-color:var(--danger-bg); color:var(--danger); }
.btn.ghost{ background:none; border-color:transparent; }
.btn.sm{ padding:5px 10px; font-size:12.5px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

input[type=text], input[type=number], select, textarea{
  padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface);
  width:100%;
}
input[type=number]{ width:80px; }
textarea{ resize:vertical; min-height:80px; }
label.field{ font-size:12px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px; }

table{ border-collapse:collapse; width:100%; }
th,td{ padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; }
th{ font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); font-weight:700; }
th.pctcell,td.pctcell{ padding-right:4px; }
th.colsep,td.colsep{ padding-left:4px; border-right:1.5px solid var(--border); padding-right:16px; }
tr:last-child td{ border-bottom:none; }
.tablewrap{ overflow-x:auto; }
tbody tr{ background:var(--surface); }
tbody tr:nth-child(even){ background:var(--surface-2); }
tbody tr:hover{ background:var(--primary-bg); }
tbody tr.active-row{ background:var(--primary-bg); }
.stickycol{ position:sticky; left:0; background:inherit; box-shadow:3px 0 6px -3px rgba(20,25,45,.28); z-index:2; white-space:nowrap; }
thead .stickycol{ background:var(--surface); z-index:3; }
tr.termrow th{ text-align:center; font-size:12px; }
.avatar{ display:inline-flex; align-items:center; justify-content:center; width:29px; height:29px; border-radius:50%; font-size:11.5px; font-weight:800; color:#fff; flex:0 0 29px; margin-right:9px; }
.namecell{ display:flex; align-items:center; }
.attn-item{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
.attn-item:last-child{ border-bottom:none; }
.trend{ font-size:11px; font-weight:800; margin-left:4px; }
.trend.up{ color:var(--g-a); } .trend.down{ color:var(--g-x); } .trend.flat{ color:var(--text-faint); }

.badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:40px; padding:3px 9px;
  border-radius:999px; font-weight:800; font-size:12.5px; letter-spacing:.02em;
}
.badge.empty{ background:var(--surface-2); color:var(--text-faint); font-weight:600; }
.pct{ font-variant-numeric:tabular-nums; font-weight:700; }

.progress{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
.progress > div{ height:100%; border-radius:6px; }

.emptystate{ text-align:center; padding:40px 20px; color:var(--text-faint); }
.emptystate .big{ font-size:42px; margin-bottom:8px; }

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface-2); cursor:pointer; font-weight:700; font-size:12.5px;
}
.chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

.toggle{
  width:30px; height:30px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-2);
  cursor:pointer; font-weight:800; display:inline-flex; align-items:center; justify-content:center; color:var(--text-faint);
}
.toggle.on{ background:var(--g-a-bg); border-color:var(--g-a); color:var(--g-a); }
.toggle.half{ background:var(--g-c-bg); border-color:var(--g-c); color:var(--g-c); }
.seg{ display:inline-flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
.seg button{ border:none; background:var(--surface-2); width:26px; height:30px; font-weight:800; cursor:pointer; color:var(--text-faint); border-right:1px solid var(--border); }
.seg button:last-child{ border-right:none; }
.seg button.on{ background:var(--primary); color:#fff; }

.dashcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); cursor:pointer; transition:transform .08s ease; }
.dashcard:hover{ transform:translateY(-2px); border-color:var(--primary); }
.dashcard .name{ font-weight:800; font-size:15px; display:flex; align-items:center; }
.dashcard .final{ display:flex; align-items:baseline; gap:8px; margin:10px 0; }
.dashcard .final .num{ font-size:26px; font-weight:800; }
.termsmini{ display:flex; gap:8px; margin-top:8px; }
.termsmini .t{ flex:1; text-align:center; background:var(--surface-2); border-radius:8px; padding:6px 4px; }
.termsmini .t .tl{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; }
.ministats{ display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.ministats .m{ flex:1; text-align:center; }
.ministats .m .ml{ font-size:9.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; margin-bottom:3px; }

/* barre de classes (bandeau du haut) */
.classBar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.classPill{
  display:inline-flex; align-items:center; gap:5px; padding:7px 13px; border-radius:999px;
  border:1px solid rgba(243,190,49,.35); background:rgba(255,255,255,.05); color:var(--cream);
  cursor:pointer; font-weight:700; font-size:12.5px; white-space:nowrap;
}
.classPill .cnt{ opacity:.65; font-weight:600; }
.classPill.active{ background:var(--gold); border-color:var(--gold); color:var(--navy-deep); }
.iconbtn{
  width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px;
  border:1px solid rgba(243,190,49,.35); background:rgba(255,255,255,.05); color:var(--cream); cursor:pointer; font-size:13px;
}
.iconbtn.danger{ border-color:rgba(214,69,80,.5); color:#f0a0a6; }

.commentBtn{
  width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  cursor:pointer; font-size:12px; color:var(--text-faint); display:inline-flex; align-items:center; justify-content:center;
}
.commentBtn.has{ background:var(--primary-bg); border-color:var(--primary); color:var(--primary-dark); }
.commentNote{
  font-size:11px; color:var(--text-faint); margin-top:2px; max-width:160px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.commentNote.expanded{
  white-space:pre-wrap; overflow:visible; max-width:240px; background:var(--surface-2);
  border-radius:6px; padding:4px 6px; margin:2px -6px 0;
}

.commentHistory{ display:flex; flex-direction:column; gap:10px; }
.commentEntry{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; background:var(--surface-2); }
.commentEntry-date{ font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:4px; }
.commentEntry-text{ font-size:13px; white-space:pre-wrap; color:var(--text-muted); }

.banner{ background:var(--primary-bg); border:1px solid var(--primary); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; color:var(--primary-dark); font-weight:600; font-size:13.5px; }

.rubric-grade-card{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:10px; }
.rubric-grade-card .head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.rubric-grade-card p{ font-size:13px; margin:0 0 4px 0; color:var(--text-muted); }
.rubric-grade-card p b{ color:var(--text); }

.weekTabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }

details.card summary{ cursor:pointer; font-weight:700; list-style:revert; }
details.card[open] summary{ margin-bottom:6px; }

.legend{ display:flex; gap:14px; margin-top:6px; font-size:11.5px; color:var(--text-muted); flex-wrap:wrap; }
.legend .dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; }

.langToggle{ display:inline-flex; border:1.5px solid var(--border); border-radius:999px; overflow:hidden; }
.langToggle button{ border:none; background:var(--surface-2); padding:6px 12px; font-weight:700; font-size:12px; cursor:pointer; color:var(--text-muted); }
.langToggle button.on{ background:var(--primary); color:#fff; }

.footer-note{ text-align:center; color:var(--text-faint); font-size:11.5px; padding:20px 0 6px; }

@media print{
  #sidebar, #topbar, #mobileNav, .noprint{ display:none !important; }
  #content{ max-width:100%; padding:0; }
  body{ background:#fff; }
  .card{ box-shadow:none; border:1px solid #ccc; }
  details.card{ display:block !important; }
}
</style>
</head>
<body>
<div style="position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9999;background:#1A2047;color:#fff;border:1px solid #F3BE31;font:13px Calibri,sans-serif;letter-spacing:.06em;padding:6px 14px;pointer-events:none">Démo · élèves fictifs · rien n’est envoyé en ligne</div>
<div id="splash">
  <div class="stars"></div>
  <span class="sparkle" style="left:14%;top:20%;font-size:14px">✦</span>
  <span class="sparkle" style="left:82%;top:12%;font-size:20px">✦</span>
  <span class="sparkle" style="left:91%;top:32%;font-size:11px">✦</span>
  <span class="sparkle" style="left:6%;top:55%;font-size:10px">✦</span>
  <svg class="mountains" viewBox="0 0 1600 340" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <radialGradient id="peakGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--gold-light)" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="var(--gold-light)" stop-opacity="0"/>
      </radialGradient>
    </defs>

function gradeDisplayText(grade){
  return grade === 'Sous D' ? t('grade_below_d') : grade;
}

function t(key, vars){
  const lang = (state && state.settings && state.settings.lang) || 'fr';
  let str = (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (vars){
    Object.keys(vars).forEach(k => { str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}
function curLang(){ return (state && state.settings && state.settings.lang) || 'fr'; }
function localeTag(){ return curLang()==='en' ? 'en-GB' : 'fr-FR'; }
function formatDateShort(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(localeTag(), {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' + d.toLocaleTimeString(localeTag(), {hour:'2-digit', minute:'2-digit'});
}
function copyTextToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{});
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
}

const APP_VERSION = '2026.09.23a';

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function defaultBoundaries(){
  return [
    {grade:'A+', min:90, label:'Exceptionnel'},
    {grade:'A', min:85, label:'Excellent'},
    {grade:'A-', min:80, label:'Très solide'},
    {grade:'B+', min:75, label:'Solide'},
    {grade:'B', min:70, label:'Bien'},
    {grade:'C+', min:65, label:'Satisfaisant confirmé'},
    {grade:'C', min:60, label:'Satisfaisant'},
    {grade:'D+', min:55, label:'En progression'},
    {grade:'D', min:50, label:'Insuffisant'},
    {grade:'Sous D', min:0, label:'Très insuffisant'}
  ];
}

function defaultState(){
  const c1 = uid(), c2 = uid();
  return {
    version: 3,
    settings:{ attainmentWeight:60, effortWeight:40, boundaries: defaultBoundaries(), lang:'fr' },
    classes:[ {id:c1, name:'G11 ASDP'}, {id:c2, name:'G12 ASDP'} ],
    students:[],
    assessments:[],
    weeks:[],
    marks:{},
    effort:{},
    comments:{},
    assessComments:{},
    weekComments:{},
    activeClassId: c1,
    activeWeekByClass:{},
    lastSaved:null
  };
}

let state = loadState();

function migrateComments(st){
  st.comments = st.comments || {};
  Object.keys(st.comments).forEach(sid => {
    const v = st.comments[sid];
    if (typeof v === 'string'){
      st.comments[sid] = v.trim() ? [{text:v, date:null}] : [];
    } else if (!Array.isArray(v)){
      st.comments[sid] = [];
    }
  });
}

function loadState(){
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw || location.hash === '#demo') { raw = JSON.stringify(DEMO_STATE); try{ localStorage.setItem(STORAGE_KEY, raw); }catch(_){} if (location.hash === '#demo') { try{ history.replaceState(null, '', location.pathname); }catch(_){} } }
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.classes) return defaultState();
    parsed.activeWeekByClass = parsed.activeWeekByClass || {};
    parsed.comments = parsed.comments || {};
    migrateComments(parsed);
    parsed.assessComments = parsed.assessComments || {};
    parsed.weekComments = parsed.weekComments || {};
    parsed.settings = parsed.settings || {};
    parsed.settings.lang = parsed.settings.lang || 'fr';
    if (!parsed.activeClassId && parsed.classes[0]) parsed.activeClassId = parsed.classes[0].id;
    return parsed;
  }catch(e){
    console.error('Lecture de la sauvegarde impossible, réinitialisation.', e);
    return defaultState();
  }
}

function saveState(){
  state.lastSaved = new Date().toISOString();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    alert(t('save_error_alert'));
  }
  renderSavedTag();
}

function renderSavedTag(){
  const el = document.getElementById('savedTag');
  if (!el) return;
  if (!state.lastSaved){ el.textContent = ''; return; }
  const d = new Date(state.lastSaved);
  el.textContent = t('saved_at') + d.toLocaleTimeString(localeTag(), {hour:'2-digit', minute:'2-digit'});
}

/* =========================================================
   MOTEUR DE CALCUL (reflète — et corrige — la logique du classeur Excel)
========================================================= */
function boundariesSorted(){
  return [...state.settings.boundaries].sort((a,b)=> b.min - a.min);
}

function gradeFor(pct){
  if (pct === null || pct === undefined || isNaN(pct)) return null;
  const list = boundariesSorted();
  for (const b of list){ if (pct >= b.min) return b; }
  return list[list.length-1] || null;
}

function gradeColorVar(gradeLabel){
  if (!gradeLabel) return null;
  if (gradeLabel.startsWith('A')) return {fg:'var(--g-a)', bg:'var(--g-a-bg)'};
  if (gradeLabel.startsWith('B')) return {fg:'var(--g-b)', bg:'var(--g-b-bg)'};
  if (gradeLabel.startsWith('C')) return {fg:'var(--g-c)', bg:'var(--g-c-bg)'};
  if (gradeLabel.startsWith('D')) return {fg:'var(--g-d)', bg:'var(--g-d-bg)'};
  return {fg:'var(--g-x)', bg:'var(--g-x-bg)'};
}

function badgeHtml(gradeObj){
  if (!gradeObj) return '<span class="badge empty">—</span>';
  const c = gradeColorVar(gradeObj.grade);
  return `<span class="badge" style="background:${c.bg};color:${c.fg}" title="${escapeHtml(gradeObj.label||'')}">${escapeHtml(gradeDisplayText(gradeObj.grade))}</span>`;
}

function pctHtml(pct){
  if (pct === null || pct === undefined || isNaN(pct)) return '<span class="hint">—</span>';
  return `<span class="pct">${pct.toFixed(1)}%</span>`;
}

function progressBar(pct, gradeObj){
  const c = gradeObj ? gradeColorVar(gradeObj.grade) : {fg:'var(--text-faint)'};
  const w = pct === null || pct === undefined || isNaN(pct) ? 0 : Math.max(0, Math.min(100, pct));
  return `<div class="progress"><div style="width:${w}%;background:${c.fg}"></div></div>`;
}

function weightedAttainment(assessmentList, marksMap){
  // Moyenne simple, à parts égales entre toutes les évaluations comptabilisées et saisies
  // (plus de pondération individuelle par évaluation).
  let sum = 0, count = 0;
  for (const a of assessmentList){
    if (!a.include) continue;
    const raw = marksMap ? marksMap[a.id] : undefined;
    if (raw === undefined || raw === null || raw === '') continue;
    const max = Number(a.maxMarks) || 0;
    if (max <= 0) continue;
    let pct = (Number(raw) / max) * 100;
    pct = Math.max(0, Math.min(100, pct));
    sum += pct;
    count++;
  }
  return count > 0 ? (sum / count) : null;
}

function weekTotal(entry){
  if (!entry) return null;
  // p/eq/t/f valent 0, 0.5 (partiel) ou 1 — on garde la vraie valeur, pas juste vrai/faux.
  const p = Number(entry.p)||0, eq = Number(entry.eq)||0, t2 = Number(entry.t)||0, f = Number(entry.f)||0;
  const part = Number(entry.part)||0;
  return p+eq+t2+f+part;
}
function triSymbol(v){
  v = Number(v)||0;
  if (v>=1) return '✓';
  if (v>0) return '½';
  return '—';
}

function averageEffort(weekList, effortMap){
  const vals = [];
  for (const w of weekList){
    const e = effortMap ? effortMap[w.id] : undefined;
    if (!e || !e.touched) continue;
    const total = weekTotal(e);
    vals.push((total/7)*100);
  }
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function combineOverall(attPct, effPct){
  if (attPct === null || attPct === undefined || effPct === null || effPct === undefined) return null;
  const wA = (Number(state.settings.attainmentWeight)||0)/100;
  const wE = (Number(state.settings.effortWeight)||0)/100;
  return attPct*wA + effPct*wE;
}

function computeStudentStats(studentId, classId){
  const assessments = state.assessments.filter(a=>a.classId===classId);
  const weeks = state.weeks.filter(w=>w.classId===classId);
  const marksMap = state.marks[studentId] || {};
  const effortMap = state.effort[studentId] || {};
  const terms = {};
  for (const term of [1,2,3]){
    const aList = assessments.filter(a=>a.term===term);
    const wList = weeks.filter(w=>w.term===term);
    const attPct = weightedAttainment(aList, marksMap);
    const effPct = averageEffort(wList, effortMap);
    const overall = combineOverall(attPct, effPct);
    terms[term] = {
      attPct, effPct, overall,
      attGrade: gradeFor(attPct), effGrade: gradeFor(effPct), overallGrade: gradeFor(overall)
    };
  }
  const finalAtt = weightedAttainment(assessments, marksMap);
  const finalEff = averageEffort(weeks, effortMap);
  const finalOverall = combineOverall(finalAtt, finalEff);
  const final = {
    attPct: finalAtt, effPct: finalEff, overall: finalOverall,
    attGrade: gradeFor(finalAtt), effGrade: gradeFor(finalEff), overallGrade: gradeFor(finalOverall)
  };
  return { terms, final };
}



function latestWeek(classId){
  const weeks = state.weeks.filter(w=>w.classId===classId);
  return weeks.length ? weeks[weeks.length-1] : null;
}
function weekTouchedCount(week, students){
  if (!week) return {done:0, total:students.length, missing:[]};
  const missing = students.filter(s => {
    const e = state.effort[s.id] && state.effort[s.id][week.id];
    return !e || !e.touched;
  });
  return {done: students.length - missing.length, total: students.length, missing};
}
function goToEffortWeek(week){
  if (!week) return;
  state._effortTerm = week.term;
  if (!state.activeWeekByClass[week.classId]) state.activeWeekByClass[week.classId] = {};
  state.activeWeekByClass[week.classId][week.term] = week.id;
  activeTab = 'effort';
  renderAll();
}
// Dernière évaluation / dernière semaine d'effort saisie pour un élève, dans un trimestre donné
// (utilisé par les mini-indicateurs du Menu principal).
function lastAssessmentFor(studentId, classId, term){
  const list = state.assessments.filter(a=>a.classId===classId && a.term===term);
  const marksMap = state.marks[studentId] || {};
  for (let i=list.length-1; i>=0; i--){
    const a = list[i];
    const raw = marksMap[a.id];
    if (raw===undefined || raw===null || raw==='') continue;
    const max = Number(a.maxMarks)||0;
    if (max<=0) continue;
    const pct = Math.max(0,Math.min(100,(Number(raw)/max)*100));
    return {assessment:a, pct, grade:gradeFor(pct)};
  }
  return null;
}
function lastEffortFor(studentId, classId, term){
  const list = state.weeks.filter(w=>w.classId===classId && w.term===term);
  const effortMap = state.effort[studentId] || {};
  for (let i=list.length-1; i>=0; i--){
    const w = list[i];
    const e = effortMap[w.id];
    if (!e || !e.touched) continue;
    const pct = (weekTotal(e)/7)*100;
    return {week:w, pct, grade:gradeFor(pct)};
  }
  return null;
}

          glob:"Good overall profile: the student is meeting expectations well and sometimes exceeds them." },
  'C+': { att:"Secure satisfactory attainment. Work meets expectations and shows some strengths, but analysis, detail, or accuracy may be uneven.",
          eff:"Secure satisfactory effort. Usually prepared and on task, with generally positive participation and conduct.",
          glob:"Secure satisfactory overall profile: expected standards are met, with some stronger habits or outcomes emerging." },
  'C':  { att:"Satisfactory attainment. Work meets the basic expected standard but rarely goes beyond it.",
          eff:"Satisfactory effort. Usually punctual, usually prepared, usually follows instructions, and maintains acceptable behaviour and participation.",
          glob:"Satisfactory overall profile: the student does what is expected in attainment and effort." },
  'D+': { att:"Developing attainment. Work is close to the required standard but is inconsistent or incomplete in accuracy, explanation, evidence, or structure.",
          eff:"Developing effort. Some positive learning behaviours are evident, but punctuality, preparation, focus, participation, or completion are inconsistent.",
          glob:"Developing overall profile: the student is close to the required standard but needs greater consistency." },
  'D':  { att:"Limited attainment. Work falls below the required standard and shows significant gaps in knowledge, skills, completion, or accuracy.",
          eff:"Needs improvement. Concerns may include late arrival, missing equipment, limited focus, low participation, poor use of class time, missed homework, inappropriate use of technology, or disruptive behaviour.",
          glob:"Needs improvement overall: attainment and/or effort are below the required standard and require intervention." },
  'Sous D': { att:"Significantly below the D boundary. Evidence of attainment is insufficient, missing, or far below the course expectation.",
          eff:"Significantly below the D boundary. Effort evidence is very limited or there are repeated concerns with core learning behaviours.",
          glob:"Significantly below the expected overall standard; teacher review and support planning are required." }
}
};
function rubricsFor(grade){
  const lang = curLang();
  return (RUBRICS[lang] && RUBRICS[lang][grade]) || RUBRICS.fr[grade];
}

function studentColor(id){
  let hash = 0;
  const str = String(id);
  for (let i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i)) >>> 0; }
  return `hsl(${hash % 360}, 60%, 42%)`;
}
function initials(name){
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function avatarHtml(student){
  return `<span class="avatar" style="background:${studentColor(student.id)}">${initials(student.name)}</span>`;

}

function chartFrame(){
  return {W:320, H:170, padL:30, padR:10, padT:12, padB:24};
}
function drawChartAxes(yFor, xLabelFn, xPositions){
  const {W,H,padL,padR} = chartFrame();
  let svg = '';
  [0,50,100].forEach(v => {
    const y = yFor(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" font-size="8" fill="var(--text-faint)" text-anchor="end">${v}</text>`;
  });
  xPositions.forEach(({x,i}) => {
    const label = xLabelFn(i);
    if (label) svg += `<text x="${x}" y="${H-6}" font-size="9" fill="var(--text-faint)" text-anchor="middle">${label}</text>`;
  });
  return svg;
}
function chartHasData(series){
  return series.some(s => s.pts.some(p => p != null));
}
function drawChartSeries(series, yFor){
  let svg = '';
  series.forEach(s => {
    let seg = [];
    const segs = [];
    s.pts.forEach(p => {
      if (p){ seg.push(p); } else { if (seg.length>1) segs.push(seg); seg=[]; }
    });
    if (seg.length>1) segs.push(seg);
    segs.forEach(sgpts => {
      svg += `<polyline points="${sgpts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    });
    s.pts.forEach(p => { if (p) svg += `<circle cx="${p.x}" cy="${p.y}" r="3.2" fill="${s.color}"/>`; });
  });
  return svg;
}

// Repli historique : 3 points, un par trimestre (utilisé tant qu'aucune semaine n'a été créée pour la classe).
function progressChartSvgByTerm(stats){
  const {W,H,padL,padR,padT,padB} = chartFrame();
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const terms = [1,2,3];
  const xFor = i => padL + plotW * (i/(terms.length-1));
  const yFor = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;
  const series = [
    {key:'attPct', color:'var(--g-b)'},
    {key:'effPct', color:'var(--g-c)'},
    {key:'overall', color:'var(--g-a)'}
  ].map(s => ({...s, pts: terms.map((tt,i) => { const v = stats.terms[tt][s.key]; return v==null ? null : {x:xFor(i), y:yFor(v)}; })}));
  if (!chartHasData(series)){
    return `<div class="emptystate" style="padding:24px 10px"><div class="big">📈</div><p class="hint">${t('chart_empty')}</p></div>`;
  }
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="170" role="img" aria-label="chart">`;
  svg += drawChartAxes(yFor, i => `${t('term').slice(0,1)}${terms[i]}`, terms.map((tt,i)=>({x:xFor(i), i})));
  svg += drawChartSeries(series, yFor);
  svg += `</svg>`;
  return svg;
}

// Vue détaillée : un point par semaine créée pour l'effort, un point par évaluation reliée à une semaine
// pour les résultats, un point de contrôle par trimestre (sur sa dernière semaine) pour la note globale.
function progressChartSvg(cls, weeks, assessments, marksMap, effortMap, stats){
  const {W,H,padL,padR,padT,padB} = chartFrame();
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = weeks.length;
  const xFor = i => padL + (n>1 ? plotW*(i/(n-1)) : plotW/2);
  const yFor = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;

  const effortPts = weeks.map((w,i) => {
    const e = effortMap[w.id];
    if (!e || !e.touched) return null;
    return {x:xFor(i), y:yFor((weekTotal(e)/7)*100)};
  });

  const weekIndexById = {};
  weeks.forEach((w,i) => { weekIndexById[w.id] = i; });
  const byWeekPct = {};
  assessments.forEach(a => {
    if (!a.weekId || weekIndexById[a.weekId]===undefined) return;
    const raw = marksMap[a.id];
    if (raw===undefined || raw===null || raw==='') return;
    const max = Number(a.maxMarks)||0;
    if (max<=0) return;
    const pct = Math.max(0,Math.min(100,(Number(raw)/max)*100));
    const wi = weekIndexById[a.weekId];
    (byWeekPct[wi] = byWeekPct[wi] || []).push(pct);
  });
  const resultPts = weeks.map((w,i) => {
    const arr = byWeekPct[i];
    if (!arr || !arr.length) return null;
    return {x:xFor(i), y:yFor(arr.reduce((a,b)=>a+b,0)/arr.length)};
  });

  const globalPts = weeks.map(()=>null);
  [1,2,3].forEach(term => {
    let lastIdx = -1;
    weeks.forEach((w,i) => { if (w.term===term) lastIdx = i; });
    if (lastIdx<0) return;
    const overall = stats.terms[term].overall;
    if (overall==null) return;
    globalPts[lastIdx] = {x:xFor(lastIdx), y:yFor(overall)};
  });

  const termFirstIdx = {};
  weeks.forEach((w,i) => { if (termFirstIdx[w.term]===undefined) termFirstIdx[w.term]=i; });
  const xPositions = Object.keys(termFirstIdx).map(term => ({x:xFor(termFirstIdx[term]), i:Number(term)}));

  const series = [
    {pts:resultPts, color:'var(--g-b)'},
    {pts:effortPts, color:'var(--g-c)'},
    {pts:globalPts, color:'var(--g-a)'}
  ];
  if (!chartHasData(series)){
    return `<div class="emptystate" style="padding:24px 10px"><div class="big">📈</div><p class="hint">${t('chart_empty')}</p></div>`;
  }
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="170" role="img" aria-label="chart">`;
  svg += drawChartAxes(yFor, i => `${t('term').slice(0,1)}${i}`, xPositions);
  svg += drawChartSeries(series, yFor);
  svg += `</svg>`;
  return svg;
}

// Contrôles d'effort réutilisés dans la fiche élève (élève fixe = s.id, donc paramétrés
// juste par semaine+critère, contrairement à ceux de la grille Effort hebdo).
function ficheTriBtn(weekId, field, val){
  val = Number(val)||0;
  const cls = val>=1 ? 'on' : (val>0 ? 'half' : '');
  const label = val>=1 ? '✓' : (val>0 ? '½' : '');
  return `<button class="toggle ${cls}" data-fiche-eff-tri="${weekId}|${field}">${label}</button>`;
}
function ficheSegBtn(weekId, val){
  val = val||0;
  return `<span class="seg">${[0,1,2,3].map(n=>`<button class="${val===n?'on':''}" data-fiche-eff-part="${weekId}|${n}">${n}</button>`).join('')}</span>`;
}

      ${assessments.map(a => {

        const hasVal = raw !== undefined && raw !== null && raw !== '';
        const pct = hasVal ? Math.max(0,Math.min(100,(Number(raw)/(Number(a.maxMarks)||1))*100)) : null;
        const g = gradeFor(pct);
        const cm = (state.assessComments[s.id]||{})[a.id];

        const e = effortMap[w.id] || {p:0,eq:0,t:0,f:0,part:0,touched:false};

        const pct = touched ? (total/7)*100 : null;

          <td>${ficheTriBtn(w.id,'p',e.p)}</td>
          <td>${ficheTriBtn(w.id,'eq',e.eq)}</td>
          <td>${ficheTriBtn(w.id,'t',e.t)}</td>
          <td>${ficheTriBtn(w.id,'f',e.f)}</td>
          <td>${ficheSegBtn(w.id, e.part)}</td>

          <td>${touched?pctHtml(pct):'<span class="hint">—</span>'}</td>

    saveState(); renderAll();

    const aid = btn.dataset.assessComment;

    const text = prompt(t('prompt_assess_comment'), existing ? existing.text : '');
    if (text === null) return;
    if (!state.assessComments[s.id]) state.assessComments[s.id] = {};
    if (text.trim() === '') delete state.assessComments[s.id][aid];
    else state.assessComments[s.id][aid] = {text:text.trim(), date:new Date().toISOString()};
    saveState(); renderAll();
  }));
  root.querySelectorAll('[data-week-comment]').forEach(btn => btn.addEventListener('click', () => {
    const wid = btn.dataset.weekComment;
    const existing = (state.weekComments[s.id]||{})[wid];
    const text = prompt(t('prompt_week_comment'), existing ? existing.text : '');
    if (text === null) return;
    if (!state.weekComments[s.id]) state.weekComments[s.id] = {};
    if (text.trim() === '') delete state.weekComments[s.id][wid];
    else state.weekComments[s.id][wid] = {text:text.trim(), date:new Date().toISOString()};
    saveState(); renderAll();
  }));
  root.querySelectorAll('.commentNote').forEach(el => el.addEventListener('click', () => el.classList.toggle('expanded')));
  root.querySelectorAll('[data-chart-term]').forEach(el => el.addEventListener('click', () => {
    state._chartTerm = el.dataset.chartTerm;
    renderAll();
  }));
  document.getElementById('renameStudentBtn').onclick = () => {
    const name = prompt(t('prompt_rename_student'), s.name);
    if (name && name.trim()){ s.name = name.trim(); saveState(); renderAll(); }
  };
  const prevBtn = document.getElementById('prevStudentBtn');
  if (prevBtn) prevBtn.onclick = () => gotoAdjacentStudent(-1);
  const nextBtn = document.getElementById('nextStudentBtn');
  if (nextBtn) nextBtn.onclick = () => gotoAdjacentStudent(1);
  document.getElementById('printFicheBtn').onclick = () => window.print();
  document.getElementById('deleteStudentBtn').onclick = () => {
    if (!confirm(t('confirm_delete_student_fiche', {name:s.name}))) return;
    state.students = state.students.filter(st=>st.id!==s.id);
    delete state.marks[s.id]; delete state.effort[s.id]; delete state.comments[s.id]; delete state.assessComments[s.id]; delete state.weekComments[s.id];
    saveState(); backToMenu();
  };

  const commentBox = document.getElementById('commentBox');
  document.getElementById('saveCommentBtn').onclick = () => {
    const text = commentBox.value.trim();
    if (!text) return;
    if (!state.comments[s.id]) state.comments[s.id] = [];
    state.comments[s.id].push({text, date:new Date().toISOString()});
    saveState(); renderAll();
  };
  document.getElementById('resetCommentBtn').onclick = () => {
    commentBox.value = suggested;
  };
  root.querySelectorAll('[data-copy-comment]').forEach(btn => btn.addEventListener('click', () => {
    const idx = Number(btn.dataset.copyComment);
    const entry = (state.comments[s.id]||[])[idx];
    if (!entry) return;
    copyTextToClipboard(entry.text);
  }));
  root.querySelectorAll('[data-del-comment]').forEach(btn => btn.addEventListener('click', () => {
    const idx = Number(btn.dataset.delComment);
    if (!confirm(t('confirm_delete_comment'))) return;
    state.comments[s.id].splice(idx, 1);
    saveState(); renderAll();
  }));
}

  root.innerHTML = html;

  root.querySelectorAll('[data-config-term]').forEach(el => el.addEventListener('click', () => {
    state._configTerm = Number(el.dataset.configTerm);
    renderAll();
  }));

  root.querySelectorAll('[data-a-name]').forEach(el => el.addEventListener('change', () => {
    const a = state.assessments.find(x=>x.id===el.dataset.aName); if (a){ a.name = el.value.trim()||a.name; saveState(); }
  }));
  root.querySelectorAll('[data-a-max]').forEach(el => el.addEventListener('change', () => {
    const a = state.assessments.find(x=>x.id===el.dataset.aMax); if (a){ a.maxMarks = Number(el.value)||0; saveState(); renderAll(); }
  }));
  root.querySelectorAll('[data-a-week]').forEach(el => el.addEventListener('change', () => {
    const a = state.assessments.find(x=>x.id===el.dataset.aWeek); if (a){ a.weekId = el.value || null; saveState(); }
  }));
  root.querySelectorAll('[data-a-include]').forEach(el => el.addEventListener('change', () => {
    const a = state.assessments.find(x=>x.id===el.dataset.aInclude); if (a){ a.include = el.checked; saveState(); renderAll(); }
  }));
  root.querySelectorAll('[data-a-del]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.aDel;
    if (!confirm(t('confirm_delete_assess'))) return;
    state.assessments = state.assessments.filter(x=>x.id!==id);
    Object.keys(state.marks).forEach(sid => { if (state.marks[sid]) delete state.marks[sid][id]; });
    Object.keys(state.assessComments).forEach(sid => { if (state.assessComments[sid]) delete state.assessComments[sid][id]; });
    saveState(); renderAll();
  }));
  root.querySelectorAll('[data-add-term]').forEach(el => el.addEventListener('click', () => {
    const term = Number(el.dataset.addTerm);
    const name = prompt(t('prompt_assess_name'), t('assess_default_name'));
    if (!name) return;
    state.assessments.push({id:uid(), classId:cls.id, term, name:name.trim(), maxMarks:20, include:true});
    saveState(); renderAll();
  }));

  root.querySelectorAll('[data-w-name]').forEach(el => el.addEventListener('change', () => {
    const w = state.weeks.find(x=>x.id===el.dataset.wName); if (w){ w.label = el.value.trim()||w.label; saveState(); }
  }));
  root.querySelectorAll('[data-w-del]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.wDel;
    if (!confirm(t('confirm_delete_week'))) return;
    state.weeks = state.weeks.filter(w=>w.id!==id);
    Object.keys(state.effort).forEach(sid => { if (state.effort[sid]) delete state.effort[sid][id]; });
    Object.keys(state.weekComments).forEach(sid => { if (state.weekComments[sid]) delete state.weekComments[sid][id]; });
    state.assessments.forEach(a => { if (a.weekId===id) a.weekId = null; });
    Object.keys(state.activeWeekByClass).forEach(cid => {
      const byTerm = state.activeWeekByClass[cid];
      Object.keys(byTerm).forEach(term => { if (byTerm[term]===id) delete byTerm[term]; });
    });
    saveState(); renderAll();
  }));
  root.querySelectorAll('[data-week-add]').forEach(el => el.addEventListener('click', () => {
    const term = Number(el.dataset.weekAdd);
    const n = state.weeks.filter(w=>w.classId===cls.id && w.term===term).length + 1;
    const label = prompt(t('prompt_week_name'), t('week_default_name') + ' ' + n);
    if (!label) return;
    state.weeks.push({id:uid(), classId:cls.id, term, label:label.trim()});
    saveState(); renderAll();
  }));

  root.querySelectorAll('[data-goto-marks]').forEach(el => el.addEventListener('click', () => {
    activeTab = 'marks'; renderAll();
  }));
  root.querySelectorAll('[data-goto-effort]').forEach(el => el.addEventListener('click', () => {
    state._effortTerm = Number(el.dataset.gotoEffort);
    activeTab = 'effort'; renderAll();
  }));
}

/* =========================================================
   NOTES (Attainment Markbook)
========================================================= */
function renderMarks(root){
  const cls = getActiveClass();
  if (!cls){ root.innerHTML = emptyState('🏫', t('empty_no_class_title'), t('empty_no_class_text')); return; }
  const students = classStudents(cls.id);
  const assessments = state.assessments.filter(a=>a.classId===cls.id).sort((a,b)=> a.term-b.term);
  const backBtnHtml = `<div class="card noprint"><button class="btn sm" id="backToConfigBtn">${t('back_to_configure')}</button></div>`;
  if (!students.length){ root.innerHTML = backBtnHtml + emptyState('🧑‍🎓', t('empty_no_students_title'), t('empty_no_students_text')); document.getElementById('backToConfigBtn').onclick = () => { activeTab='configure'; renderAll(); }; return; }
  if (!assessments.length){ root.innerHTML = backBtnHtml + emptyState('📝', t('empty_no_assessments_title'), t('empty_no_assessments_text')); document.getElementById('backToConfigBtn').onclick = () => { activeTab='configure'; renderAll(); }; return; }

  const TERM_TINTS = {1:'var(--primary-bg)', 2:'var(--g-b-bg)', 3:'var(--g-c-bg)'};
  const termGroups = [];
  for (const a of assessments){
    const last = termGroups[termGroups.length-1];
    if (last && last.term === a.term) last.items.push(a);
    else termGroups.push({term:a.term, items:[a]});
  }

  let html = backBtnHtml;
  html += `<div class="card"><h2>${t('marks_title', {cls:escapeHtml(cls.name)})}</h2>
  <p class="hint">${t('marks_hint')}</p>
  <div class="tablewrap"><table><thead>
  <tr class="termrow"><th class="stickycol" rowspan="2" style="text-align:left">${t('th_student')}</th>
  ${termGroups.map(g => `<th colspan="${g.items.length}" style="background:${TERM_TINTS[g.term]||'var(--surface-2)'}">${t('term')} ${g.term}</th>`).join('')}
  </tr>
  <tr>
  ${assessments.map(a => `<th>${escapeHtml(a.name)}<br><span style="font-weight:400;text-transform:none;color:var(--text-faint)">/ ${a.maxMarks}</span></th>`).join('')}
  </tr>
  </thead><tbody>`;
  for (const s of students){
    const marksMap = state.marks[s.id] || {};
    html += `<tr><td class="stickycol"><span class="namecell">${avatarHtml(s)}<b>${escapeHtml(s.name)}</b></span></td>`;
    for (const a of assessments){
      const raw = marksMap[a.id];
      const hasVal = raw !== undefined && raw !== null && raw !== '';
      const pct = hasVal ? Math.max(0,Math.min(100,(Number(raw)/(Number(a.maxMarks)||1))*100)) : null;
      const g = gradeFor(pct);
      html += `<td>
        <input type="number" min="0" max="${a.maxMarks}" step="0.5" value="${hasVal?raw:''}" data-mark-student="${s.id}" data-mark-assess="${a.id}" style="width:64px">
        <div style="margin-top:4px">${hasVal ? `${pctHtml(pct)} ${badgeHtml(g)}` : '<span class="hint">—</span>'}</div>
      </td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div></div>`;
  root.innerHTML = html;
  document.getElementById('backToConfigBtn').onclick = () => { activeTab='configure'; renderAll(); };

  root.querySelectorAll('[data-mark-student]').forEach(el => el.addEventListener('input', () => {
    const sid = el.dataset.markStudent, aid = el.dataset.markAssess;
    if (!state.marks[sid]) state.marks[sid] = {};
    const v = el.value;
    if (v === '') delete state.marks[sid][aid];
    else state.marks[sid][aid] = Number(v);
    saveState();
  }));
  root.querySelectorAll('[data-mark-student]').forEach(el => el.addEventListener('change', renderMarksSoft));
  function renderMarksSoft(){ renderMarks(document.getElementById('content')); }

  const tbody = root.querySelector('tbody');
  if (tbody){
    tbody.addEventListener('focusin', e => { const tr = e.target.closest('tr'); if (tr) tr.classList.add('active-row'); });
    tbody.addEventListener('focusout', e => { const tr = e.target.closest('tr'); if (tr) tr.classList.remove('active-row'); });
  }
}

/* =========================================================
   EFFORT HEBDOMADAIRE
========================================================= */
function renderEffort(root){
  const cls = getActiveClass();
  if (!cls){ root.innerHTML = emptyState('🏫', t('empty_no_class_title'), t('empty_no_class_text')); return; }
  const students = classStudents(cls.id);
  if (!students.length){ root.innerHTML = emptyState('🧑‍🎓', t('empty_no_students_title'), t('empty_no_students_text')); return; }

  const activeTerm = state._effortTerm || 1;
  const weeksForTerm = state.weeks.filter(w=>w.classId===cls.id && w.term===activeTerm);
  let activeWeekId = (state.activeWeekByClass[cls.id] || {})[activeTerm];
  if (!activeWeekId || !weeksForTerm.find(w=>w.id===activeWeekId)){
    activeWeekId = weeksForTerm.length ? weeksForTerm[weeksForTerm.length-1].id : null;
  }

  const activeWeekObj = activeWeekId ? state.weeks.find(w=>w.id===activeWeekId) : null;
  const wt = activeWeekObj ? weekTouchedCount(activeWeekObj, students) : null;

  let html = `<div class="card noprint"><button class="btn sm" id="backToConfigBtn">${t('back_to_configure')}</button></div>`;
  html += `<div class="card">
    <h2>${t('effort_title', {cls:escapeHtml(cls.name)})}</h2>
    <p class="hint">${t('effort_hint')}</p>
    <div class="row" style="margin:12px 0">
      <span class="label" style="font-size:12px;font-weight:700;color:var(--text-muted)">${t('effort_term_label')}</span>
      ${[1,2,3].map(term => `<span class="chip ${term===activeTerm?'active':''}" data-term="${term}">${t('term')} ${term}</span>`).join('')}
    </div>
    <div class="weekTabs">
      ${weeksForTerm.map(w => `<span class="chip ${w.id===activeWeekId?'active':''}" data-week="${w.id}">${escapeHtml(w.label)}</span>`).join('')}
    </div>
    ${wt ? `<span class="badge" style="background:${wt.missing.length===0?'var(--g-a-bg)':'var(--g-c-bg)'};color:${wt.missing.length===0?'var(--g-a)':'var(--g-c)'}">${t('effort_recorded_badge',{done:wt.done,total:wt.total})} ${wt.missing.length===0?'✅':''}</span>` : ''}
  </div>`;

  if (!activeWeekId){
    html += emptyState('🙌', t('empty_no_weeks_title'), t('effort_empty_hint'));
    root.innerHTML = html;
    document.getElementById('backToConfigBtn').onclick = () => { activeTab='configure'; renderAll(); };
    attachEffortHandlers();
    return;
  }

  html += `<div class="card"><div class="tablewrap"><table><thead><tr>
    <th>${t('th_student')}</th><th>${t('th_punctuality_full')}</th><th>${t('th_equipment')}</th><th>${t('th_tech_full')}</th><th>${t('th_focus_full')}</th><th>${t('th_particip_full')}</th><th>${t('th_total7')}</th><th>%</th>
  </tr></thead><tbody>`;
  for (const s of students){
    if (!state.effort[s.id]) state.effort[s.id] = {};
    const e = state.effort[s.id][activeWeekId] || {p:0,eq:0,t:0,f:0,part:0,touched:false};
    const total = weekTotal(e);
    const pct = e.touched ? (total/7)*100 : null;
    html += `<tr class="${state._effortActiveStudent===s.id?'active-row':''}">
      <td><span class="namecell">${avatarHtml(s)}<b>${escapeHtml(s.name)}</b></span></td>`;
    html += `
      <td>${triBtn(s.id,'p',e.p)}</td>
      <td>${triBtn(s.id,'eq',e.eq)}</td>
      <td>${triBtn(s.id,'t',e.t)}</td>
      <td>${triBtn(s.id,'f',e.f)}</td>
      <td>${segBtn(s.id, e.part)}</td>
      <td class="pct">${e.touched? total+'/7' : '—'}</td>
      <td>${e.touched ? pctHtml(pct) : '<span class="hint">—</span>'}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;
  root.innerHTML = html;
  document.getElementById('backToConfigBtn').onclick = () => { activeTab='configure'; renderAll(); };

  function triBtn(sid, field, val){
    val = Number(val)||0;
    const cls = val>=1 ? 'on' : (val>0 ? 'half' : '');
    const label = val>=1 ? '✓' : (val>0 ? '½' : '');
    return `<button class="toggle ${cls}" data-eff-tri="${sid}|${field}">${label}</button>`;
  }
  function segBtn(sid, val){
    val = val||0;
    return `<span class="seg">${[0,1,2,3].map(n=>`<button class="${val===n?'on':''}" data-eff-part="${sid}|${n}">${n}</button>`).join('')}</span>`;
  }

  root.querySelectorAll('[data-eff-tri]').forEach(btn => btn.addEventListener('click', () => {
    const [sid, field] = btn.dataset.effTri.split('|');
    if (!state.effort[sid]) state.effort[sid] = {};
    if (!state.effort[sid][activeWeekId]) state.effort[sid][activeWeekId] = {p:0,eq:0,t:0,f:0,part:0,touched:false};
    const e = state.effort[sid][activeWeekId];
    const cur = Number(e[field])||0;
    e[field] = cur===0 ? 0.5 : (cur===0.5 ? 1 : 0);
    e.touched = true;
    state._effortActiveStudent = sid;
    saveState(); renderEffort(document.getElementById('content'));
  }));
  root.querySelectorAll('[data-eff-part]').forEach(btn => btn.addEventListener('click', () => {
    const [sid, n] = btn.dataset.effPart.split('|');
    if (!state.effort[sid]) state.effort[sid] = {};
    if (!state.effort[sid][activeWeekId]) state.effort[sid][activeWeekId] = {p:0,eq:0,t:0,f:0,part:0,touched:false};
    const e = state.effort[sid][activeWeekId];
    e.part = Number(n);
    e.touched = true;
    state._effortActiveStudent = sid;
    saveState(); renderEffort(document.getElementById('content'));
  }));

  attachEffortHandlers();

  function attachEffortHandlers(){
    root.querySelectorAll('[data-term]').forEach(el => el.addEventListener('click', () => {
      state._effortTerm = Number(el.dataset.term); renderEffort(document.getElementById('content'));
    }));
    root.querySelectorAll('[data-week]').forEach(el => el.addEventListener('click', () => {
      if (!state.activeWeekByClass[cls.id]) state.activeWeekByClass[cls.id] = {};
      state.activeWeekByClass[cls.id][activeTerm] = el.dataset.week;
      saveState(); renderEffort(document.getElementById('content'));
    }));
  }
}

/* =========================================================
   EXPORT CSV CLASSE
========================================================= */
function exportClassCsv(cls){
  const students = classStudents(cls.id);
  const T = t('term'), G = t('th_grade');
  const header = [t('th_student'),
    `${T}1 ${t('cat_results')} %`,`${T}1 ${G}`,`${T}1 ${t('cat_effort')} %`,`${T}1 ${G}`,`${T}1 ${t('cat_overall')} %`,`${T}1 ${G}`,
    `${T}2 ${t('cat_results')} %`,`${T}2 ${G}`,`${T}2 ${t('cat_effort')} %`,`${T}2 ${G}`,`${T}2 ${t('cat_overall')} %`,`${T}2 ${G}`,
    `${T}3 ${t('cat_results')} %`,`${T}3 ${G}`,`${T}3 ${t('cat_effort')} %`,`${T}3 ${G}`,`${T}3 ${t('cat_overall')} %`,`${T}3 ${G}`,
    `${t('year_summary')} ${t('cat_results')} %`,`${t('year_summary')} ${G}`,`${t('year_summary')} ${t('cat_effort')} %`,`${t('year_summary')} ${G}`,`${t('year_summary')} ${t('cat_overall')} %`,`${t('year_summary')} ${G}`];
  const rows = [header];
  for (const s of students){
    const st = computeStudentStats(s.id, cls.id);
    const row = [s.name];
    [1,2,3].forEach(term => {
      const tt = st.terms[term];
      row.push(fmtNum(tt.attPct), tt.attGrade?gradeDisplayText(tt.attGrade.grade):'', fmtNum(tt.effPct), tt.effGrade?gradeDisplayText(tt.effGrade.grade):'', fmtNum(tt.overall), tt.overallGrade?gradeDisplayText(tt.overallGrade.grade):'');
    });
    row.push(fmtNum(st.final.attPct), st.final.attGrade?gradeDisplayText(st.final.attGrade.grade):'', fmtNum(st.final.effPct), st.final.effGrade?gradeDisplayText(st.final.effGrade.grade):'', fmtNum(st.final.overall), st.final.overallGrade?gradeDisplayText(st.final.overallGrade.grade):'');
    rows.push(row);
  }
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  downloadFile(csv, `HSD_${sanitizeFilename(cls.name)}_${dateStamp()}.csv`, 'text/csv;charset=utf-8;');
}
function fmtNum(n){ return (n===null||n===undefined||isNaN(n)) ? '' : n.toFixed(1); }
function csvEscape(v){ v = String(v==null?'':v); if (/[",;\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }

/* =========================================================
   RÉGLAGES
========================================================= */
function renderSettings(root){
  const sumWeights = (Number(state.settings.attainmentWeight)||0) + (Number(state.settings.effortWeight)||0);
  const okSum = Math.abs(sumWeights-100) < 0.01;
  const lang = curLang();
  let html = `<div class="card">
    <h2>${t('settings_language_title')}</h2>
    <div class="langToggle" style="margin-top:10px">
      <button class="${lang==='fr'?'on':''}" id="langFrBtn">Français</button>
      <button class="${lang==='en'?'on':''}" id="langEnBtn">English</button>
    </div>
  </div>`;

  html += `<div class="card">
    <h2>${t('settings_weighting_title')}</h2>
    <div class="row" style="margin-top:10px">
      <div><label class="field">${t('lbl_results_pct')}</label><input type="number" id="wAtt" min="0" max="100" value="${state.settings.attainmentWeight}"></div>
      <div><label class="field">${t('lbl_effort_pct')}</label><input type="number" id="wEff" min="0" max="100" value="${state.settings.effortWeight}"></div>
      <span class="badge" style="background:${okSum?'var(--g-a-bg)':'var(--g-x-bg)'};color:${okSum?'var(--g-a)':'var(--g-x)'};margin-top:18px">${sumWeights}% ${okSum?'✅':t('badge_must_total_100')}</span>
    </div>
  </div>`;

  html += `<div class="card">
    <h2>${t('settings_thresholds_title')}</h2>
    <p class="hint">${t('settings_thresholds_hint')}</p>
    <div class="tablewrap"><table><thead><tr><th>${t('th_grade')}</th><th style="width:110px">${t('th_min_pct')}</th><th>${t('th_label')}</th></tr></thead><tbody>
    ${state.settings.boundaries.map((b,i) => `<tr>
      <td style="font-weight:800">${escapeHtml(gradeDisplayText(b.grade))}</td>
      <td><input type="number" min="0" max="100" value="${b.min}" data-bnd-min="${i}"></td>
      <td><input type="text" value="${escapeHtml(b.label)}" data-bnd-label="${i}"></td>
    </tr>`).join('')}
    </tbody></table></div>
  </div>`;

  html += `<div class="card">
    <h2>${t('settings_backup_title')}</h2>
    <p class="hint">${t('settings_backup_hint')}</p>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="exportJsonBtn">${t('btn_export_json')}</button>
      <label class="btn" for="importJsonInput">${t('btn_import_json')}</label>
      <input type="file" id="importJsonInput" accept="application/json" style="display:none">
      <button class="btn danger" id="resetBtn">${t('btn_reset_all')}</button>
    </div>
  </div>`;

  root.innerHTML = html;

  document.getElementById('langFrBtn').onclick = () => { state.settings.lang='fr'; saveState(); renderAll(); };
  document.getElementById('langEnBtn').onclick = () => { state.settings.lang='en'; saveState(); renderAll(); };

  document.getElementById('wAtt').addEventListener('change', (e) => { state.settings.attainmentWeight = Number(e.target.value)||0; saveState(); renderAll(); });
  document.getElementById('wEff').addEventListener('change', (e) => { state.settings.effortWeight = Number(e.target.value)||0; saveState(); renderAll(); });
  root.querySelectorAll('[data-bnd-min]').forEach(el => el.addEventListener('change', () => {
    state.settings.boundaries[Number(el.dataset.bndMin)].min = Number(el.value)||0; saveState(); renderAll();
  }));
  root.querySelectorAll('[data-bnd-label]').forEach(el => el.addEventListener('change', () => {
    state.settings.boundaries[Number(el.dataset.bndLabel)].label = el.value.trim(); saveState();
  }));

  document.getElementById('exportJsonBtn').onclick = () => {
    downloadFile(JSON.stringify(state, null, 2), `HSD_Humanities_sauvegarde_${dateStamp()}.json`, 'application/json');
  };
  document.getElementById('importJsonInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.classes) throw new Error('Format invalide');
        if (!confirm(t('confirm_import'))) return;
        state = parsed;
        state.activeWeekByClass = state.activeWeekByClass || {};
        state.comments = state.comments || {};
        migrateComments(state);
        state.assessComments = state.assessComments || {};
        state.weekComments = state.weekComments || {};
        state.settings = state.settings || {};
        state.settings.lang = state.settings.lang || 'fr';
        if (!state.activeClassId && state.classes[0]) state.activeClassId = state.classes[0].id;
        currentStudentId = null;
        saveState(); renderAll();
        alert(t('alert_import_success'));
      }catch(err){
        alert(t('alert_import_fail') + err.message);
      }
    };
    reader.readAsText(file);
  });
  document.getElementById('resetBtn').onclick = () => {
    if (!confirm(t('confirm_reset1'))) return;
    if (!confirm(t('confirm_reset2'))) return;
    const keepLang = state.settings.lang;
    state = defaultState();
    state.settings.lang = keepLang;
    currentStudentId = null;
    saveState(); renderAll();
  };
}

/* =========================================================
   UTILITAIRES
========================================================= */
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function dateStamp(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function sanitizeFilename(s){ return String(s).replace(/[^a-z0-9]+/gi,'_'); }
